name: Validate

on:
  pull_request:
  push:
    branches: [main]

# Pull requests run plugin code (--inspect loads new Linux builds), so keep the token read-only
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - name: Check the changed entries
        if: github.event_name == 'pull_request'
        run: |
          python scripts/validate.py \
            --base "origin/${{ github.base_ref }}" \
            --author "${{ github.event.pull_request.user.login }}" \
            --network --inspect

      - name: Check every entry
        if: github.event_name == 'push'
        run: python scripts/validate.py

      - name: Build the index
        run: python scripts/build_index.py --out site
